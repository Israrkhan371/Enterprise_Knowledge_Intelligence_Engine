services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ekie-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./scripts:/app/scripts
      - ./docs:/app/docs
      - hf_cache:/root/.cache
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ekie-postgres
    environment:
      POSTGRES_USER: ekie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ekie_password}
      POSTGRES_DB: ekie
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # Postgres reports its container as "started" well before it's ready
      # to accept connections. Without this healthcheck, api's depends_on
      # only waited for that early "started" state (condition:
      # service_started), so a fresh `docker compose up` could race api's
      # create_all()/alembic startup against Postgres still initializing -
      # api would crash on connect, `restart: unless-stopped` would loop
      # it, and if that first successful boot hadn't landed yet when
      # something ran `docker exec ekie-api pytest`, no tables would exist
      # at all yet. pg_isready + condition: service_healthy above closes
      # that race, matching the pattern already used for neo4j below.
      test: ["CMD-SHELL", "pg_isready -U ekie -d ekie"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: ekie-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ekie_password}
    ports:
      - "17474:7474"    
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ekie_password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 15s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: ekie-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: ekie-mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlruns
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ekie-prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  pg_data:
  neo4j_data:
  chroma_data:
  mlflow_data:
  hf_cache:
